[package]
name = "qsimulator"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
description = "A noiseless state-vector quantum circuit simulator with OpenQASM 2.0 support"
license = "MIT"
repository = "https://github.com/samhithak13/qsimulator"
documentation = "https://docs.rs/qsimulator"
readme = "README.md"
keywords = ["quantum", "simulator", "quantum-computing", "circuit"]
categories = ["science", "simulation"]
# Dev and CI tooling, not part of the published library.
exclude = ["/fuzz", "/crossval", "/.github"]

[dependencies]
num-complex = "0.4"
rayon = { version = "1", optional = true }

[features]
# Parallelize the single-qubit gate kernel with rayon. Off by default so the
# core stays dependency-free.
parallel = ["dep:rayon"]

[dev-dependencies]
approx = "0.5"

[[bench]]
name = "throughput"
harness = false
