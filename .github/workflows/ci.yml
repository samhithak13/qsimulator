name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Cancel a superseded in-progress run for the same ref (e.g. rapid pushes), so
# only the latest commit's run stays active.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --all-targets --verbose

      - name: Test
        run: cargo test --verbose

      - name: Test (parallel feature)
        run: cargo test --features parallel --verbose

      - name: Run examples
        run: |
          cargo run --example ghz
          cargo run --example grover
          cargo run --example qft
          cargo run --example teleportation

  lint:
    name: Format, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-lint-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (parallel feature)
        run: cargo clippy --all-targets --features parallel -- -D warnings

      - name: Docs
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  crossval:
    name: Cross-validate against Qiskit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-crossval-${{ hashFiles('**/Cargo.lock') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qiskit
        run: pip install -r crossval/requirements.txt

      - name: Compare state vectors
        run: python crossval/compare.py --trials 300 --seed 0

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit dependencies
        run: cargo audit

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    # cargo-llvm-cov adds its own instrumentation flags; don't mix in -D warnings.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Measure coverage (fail under 90% lines)
        run: cargo llvm-cov --summary-only --fail-under-lines 90

  fuzz:
    name: Fuzz parsers
    runs-on: ubuntu-latest
    # cargo-fuzz sets its own sanitizer RUSTFLAGS; don't append the workflow's.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      # Pin the gnu target: it has prebuilt std and sanitizer runtime, unlike
      # the musl target cargo-fuzz otherwise picks on the runner.
      - name: Fuzz the OpenQASM parser
        run: cargo fuzz run qasm_parse --target x86_64-unknown-linux-gnu -- -max_total_time=45

      - name: Fuzz the text program parser
        run: cargo fuzz run program_parse --target x86_64-unknown-linux-gnu -- -max_total_time=45

