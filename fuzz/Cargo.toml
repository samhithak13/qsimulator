[package]
name = "qsimulator-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.qsimulator]
path = ".."

# Keep this crate out of the parent package's build graph.
[workspace]

[[bin]]
name = "qasm_parse"
path = "fuzz_targets/qasm_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "program_parse"
path = "fuzz_targets/program_parse.rs"
test = false
doc = false
bench = false
